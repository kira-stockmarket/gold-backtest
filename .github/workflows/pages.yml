name: Deploy Backtest Results to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Automatically run on the 1st of every month at midnight UTC to fetch new data
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

# Required permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backtest and Organize Output
        run: |
          mkdir public
          # Run your script to generate the .csv and .png
          python backtest_gold_diwali.py
          
          # Move outputs into the public deployment folder
          mv diwali_gold_performance.csv public/ || true
          mv diwali_gold_plot.png public/ || true

      - name: Generate index.html
        run: |
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Gold Diwali Backtest Results</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 40px; text-align: center; background-color: #f4f4f9; }
                  h1 { color: #333; }
                  .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.05); display: inline-block; max-width: 900px; width: 100%; }
                  img { max-width: 100%; height: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #eaeaea; }
                  .button { display: inline-block; margin-top: 25px; text-decoration: none; padding: 12px 24px; background: #2ea44f; color: white; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
                  .button:hover { background: #2c974b; }
                  .footer { margin-top: 30px; font-size: 0.9em; color: #666; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Gold Performance Around Diwali 🪔</h1>
                  <p>Visualizing 15-day pre and post Diwali Gold (GC=F) historical returns.</p>
                  
                  <img src="diwali_gold_plot.png" alt="Gold Diwali Performance Chart">
                  <br>
                  <a href="diwali_gold_performance.csv" class="button" download>Download Raw CSV Data</a>
                  
                  <div class="footer">
                    Auto-generated and updated via GitHub Actions.
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
