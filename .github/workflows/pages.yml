name: Deploy Predictive Gold Model

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML Predictive Engine
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }} 
        run: |
          # 1. Force create the folder so it definitely exists
          mkdir -p public 
          
          # 2. Run your Python script
          python predict_gold_regime.py
          
          # 3. Print the contents of the folder to the logs to prove they generated
          echo "--- CHECKING GENERATED FILES ---"
          ls -la public/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Changed from './public' to just 'public' (sometimes fixes v3 archive bugs)
          path: 'public' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
